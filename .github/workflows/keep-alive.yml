name: Keep Repository Alive

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update heartbeat
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > .heartbeat

      - name: Commit heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .heartbeat
          git commit -m "chore: keep repository alive" || exit 0
          git push
