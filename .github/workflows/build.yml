name: Build and publish RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Install browser fallback
        run: python -m playwright install chromium

      - run: pytest -q

      - name: Restore last successful articles
        uses: actions/cache@v4
        with:
          path: .cache
          key: rss-state-${{ github.run_id }}
          restore-keys: rss-state-

      - name: Build feeds
        env:
          RSS_BASE_URL: ${{ vars.RSS_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          AI_MAX_NEW_SUMMARIES: ${{ vars.AI_MAX_NEW_SUMMARIES }}
        run: |
          BASE="${RSS_BASE_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/}"
          export OPENAI_MODEL="${OPENAI_MODEL:-gpt-5}"
          export AI_MAX_NEW_SUMMARIES="${AI_MAX_NEW_SUMMARIES:-3}"
          python build.py --base-url "$BASE"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
